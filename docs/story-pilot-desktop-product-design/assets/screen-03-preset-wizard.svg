<svg width="1440" height="960" viewBox="0 0 1440 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Story Pilot 预设向导</title>
  <desc id="desc">工作台中的预设选择流程，展示题材、世界观、人物原型、冲突和反套路提示。</desc>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { font-size: 20px; font-weight: 700; fill: #151515; }
    .h2 { font-size: 17px; font-weight: 700; fill: #25272b; }
    .h3 { font-size: 14px; font-weight: 700; fill: #25272b; }
    .body { font-size: 14px; fill: #4a5260; }
    .muted { font-size: 13px; fill: #858b95; }
    .small { font-size: 12px; fill: #858b95; }
    .side { fill: #f5f5f6; }
    .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
    .soft { fill: #f7f8fa; stroke: #e6e8ec; stroke-width: 1; }
    .active { fill: #111111; }
    .line { stroke: #e5e7eb; stroke-width: 1; }
    .amber { fill: #a16700; }
    .blue { fill: #0a66ff; }
  </style>

  <rect width="1440" height="960" rx="18" fill="#ffffff" stroke="#d8dbe0"/>
  <circle cx="28" cy="28" r="8" fill="#ff5f57"/>
  <circle cx="54" cy="28" r="8" fill="#ffbd2e"/>
  <circle cx="80" cy="28" r="8" fill="#28c840"/>

  <rect x="0" y="62" width="280" height="898" class="side"/>
  <line x1="280" y1="62" x2="280" y2="960" class="line"/>
  <text x="36" y="110" class="ui" font-size="23" font-weight="800" fill="#111111">story pilot</text>
  <text x="36" y="136" class="ui small">本地创作工作区</text>
  <text x="36" y="184" class="ui body">记忆库</text>
  <text x="36" y="230" class="ui body">预设库</text>
  <text x="36" y="276" class="ui body">设置</text>
  <text x="36" y="354" class="ui h3">作品</text>
  <rect x="28" y="382" width="224" height="48" rx="8" fill="#ffffff"/>
  <text x="52" y="412" class="ui h3">新作品：无名</text>
  <text x="52" y="462" class="ui body">赤月纪事</text>
  <text x="52" y="506" class="ui body">雾港来信</text>

  <rect x="280" y="62" width="824" height="898" fill="#ffffff"/>
  <line x1="280" y1="114" x2="1104" y2="114" class="line"/>
  <text x="326" y="96" class="ui h1">新作品 › 工作台 › 预设向导</text>
  <text x="326" y="154" class="ui h1">先选创作骨架，再生成作品方案</text>
  <text x="326" y="184" class="ui body">预设不是模板锁定，而是提前显性化题材承诺、冲突引擎和创作风险。</text>

  <rect x="326" y="220" width="174" height="520" rx="8" class="soft"/>
  <text x="354" y="256" class="ui h3">流程</text>
  <rect x="348" y="284" width="126" height="32" rx="8" class="active"/>
  <text x="380" y="305" class="ui small" fill="#ffffff">题材</text>
  <text x="360" y="354" class="ui body">读者</text>
  <text x="360" y="402" class="ui body">世界观</text>
  <text x="360" y="450" class="ui body">人物原型</text>
  <text x="360" y="498" class="ui body">冲突引擎</text>
  <text x="360" y="546" class="ui body">章节节奏</text>
  <text x="360" y="594" class="ui body">汇总方案</text>

  <text x="532" y="248" class="ui h2">选择题材和子类型</text>
  <rect x="532" y="278" width="250" height="142" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="560" y="312" class="ui h3">东方玄幻</text>
  <text x="560" y="344" class="ui body">承诺：成长、力量体系、世界秘密。</text>
  <text x="560" y="376" class="ui small" fill="#a16700">风险：等级堆叠、打脸套路。</text>
  <rect x="560" y="392" width="82" height="24" rx="12" fill="#f2f3f5"/>
  <text x="582" y="408" class="ui small">已选</text>

  <rect x="802" y="278" width="250" height="142" rx="8" class="panel"/>
  <text x="830" y="312" class="ui h3">悬疑解谜</text>
  <text x="830" y="344" class="ui body">承诺：公平线索、误导、真相震动。</text>
  <text x="830" y="376" class="ui small" fill="#a16700">风险：解释过晚、线索作弊。</text>

  <rect x="532" y="444" width="250" height="142" rx="8" class="panel"/>
  <text x="560" y="478" class="ui h3">低开高走</text>
  <text x="560" y="510" class="ui body">承诺：处境压迫、阶段翻盘。</text>
  <text x="560" y="542" class="ui small" fill="#a16700">风险：压抑过长，回报不足。</text>

  <rect x="802" y="444" width="250" height="142" rx="8" class="panel"/>
  <text x="830" y="478" class="ui h3">群像权谋</text>
  <text x="830" y="510" class="ui body">承诺：多方博弈、利益交换。</text>
  <text x="830" y="542" class="ui small" fill="#a16700">风险：人物过多，主线稀释。</text>

  <rect x="532" y="618" width="520" height="122" rx="8" class="soft"/>
  <text x="560" y="652" class="ui h3">已选组合</text>
  <text x="560" y="684" class="ui body">东方玄幻 + 悬疑解谜 + 低开高走</text>
  <text x="560" y="714" class="ui small">下一步将创建立项工单，并生成世界观、人物原型和前 10 章方向。</text>
  <rect x="532" y="774" width="130" height="34" rx="8" fill="#111111"/>
  <text x="558" y="796" class="ui small" fill="#ffffff">继续下一步</text>
  <rect x="674" y="774" width="130" height="34" rx="8" fill="#ffffff" stroke="#d8dadd"/>
  <text x="700" y="796" class="ui small">生成变体</text>

  <rect x="1104" y="62" width="336" height="898" fill="#f7f7f8"/>
  <line x1="1104" y1="62" x2="1104" y2="960" class="line"/>
  <text x="1134" y="112" class="ui h2">预设影响</text>

  <rect x="1130" y="146" width="252" height="150" rx="8" class="panel"/>
  <text x="1154" y="180" class="ui h3">故事承诺</text>
  <text x="1154" y="214" class="ui body">成长升级</text>
  <text x="1154" y="244" class="ui body">世界秘密</text>
  <text x="1154" y="274" class="ui body">公平线索与误导</text>

  <rect x="1130" y="318" width="252" height="178" rx="8" class="panel"/>
  <text x="1154" y="352" class="ui h3">反套路提醒</text>
  <text x="1154" y="386" class="ui body" fill="#a16700">避免退婚羞辱开局。</text>
  <text x="1154" y="416" class="ui body" fill="#a16700">不要只靠系统任务驱动。</text>
  <text x="1154" y="446" class="ui body" fill="#a16700">力量代价绑定人物缺陷。</text>

  <rect x="1130" y="518" width="252" height="174" rx="8" class="panel"/>
  <text x="1154" y="552" class="ui h3">将创建工单</text>
  <circle cx="1162" cy="586" r="7" fill="#111111"/>
  <text x="1182" y="590" class="ui body">立项工单</text>
  <circle cx="1162" cy="624" r="7" fill="#9aa0a6"/>
  <text x="1182" y="628" class="ui body">世界观工单</text>
  <circle cx="1162" cy="662" r="7" fill="#9aa0a6"/>
  <text x="1182" y="666" class="ui body">人物工单</text>

  <rect x="1130" y="714" width="252" height="108" rx="8" class="panel"/>
  <text x="1154" y="748" class="ui h3">入库策略</text>
  <text x="1154" y="782" class="ui body">先入故事圣经草稿</text>
  <text x="1154" y="812" class="ui body">确认后进入正史记忆</text>
</svg>

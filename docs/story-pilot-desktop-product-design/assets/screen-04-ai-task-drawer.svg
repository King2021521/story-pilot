<svg width="1440" height="960" viewBox="0 0 1440 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Story Pilot AI 任务抽屉</title>
  <desc id="desc">AI 命令面板创建工单后，右侧打开任务详情抽屉，展示上下文、运行步骤、产物和记忆候选。</desc>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { font-size: 20px; font-weight: 700; fill: #151515; }
    .h2 { font-size: 17px; font-weight: 700; fill: #25272b; }
    .h3 { font-size: 14px; font-weight: 700; fill: #25272b; }
    .body { font-size: 14px; fill: #4a5260; }
    .muted { font-size: 13px; fill: #858b95; }
    .small { font-size: 12px; fill: #858b95; }
    .side { fill: #f5f5f6; }
    .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
    .soft { fill: #f7f8fa; stroke: #e6e8ec; stroke-width: 1; }
    .active { fill: #111111; }
    .line { stroke: #e5e7eb; stroke-width: 1; }
    .blue { fill: #0a66ff; }
    .red { fill: #c8342d; }
    .amber { fill: #a16700; }
    .green { fill: #087443; }
  </style>

  <rect width="1440" height="960" rx="18" fill="#ffffff" stroke="#d8dbe0"/>
  <circle cx="28" cy="28" r="8" fill="#ff5f57"/>
  <circle cx="54" cy="28" r="8" fill="#ffbd2e"/>
  <circle cx="80" cy="28" r="8" fill="#28c840"/>

  <rect x="0" y="62" width="280" height="898" class="side"/>
  <line x1="280" y1="62" x2="280" y2="960" class="line"/>
  <text x="36" y="110" class="ui" font-size="23" font-weight="800" fill="#111111">story pilot</text>
  <text x="36" y="136" class="ui small">本地创作工作区</text>
  <text x="36" y="184" class="ui body">记忆库</text>
  <text x="36" y="230" class="ui body">预设库</text>
  <text x="36" y="276" class="ui body">设置</text>
  <text x="36" y="354" class="ui h3">作品</text>
  <rect x="28" y="382" width="224" height="48" rx="8" fill="#ffffff"/>
  <text x="52" y="412" class="ui h3">赤月纪事</text>
  <circle cx="236" cy="406" r="9" class="blue"/>
  <text x="232" y="410" class="ui" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="52" y="462" class="ui body">雾港来信</text>
  <text x="52" y="506" class="ui body">第七封遗书</text>

  <rect x="280" y="62" width="704" height="898" fill="#ffffff"/>
  <line x1="280" y1="114" x2="984" y2="114" class="line"/>
  <text x="326" y="96" class="ui h1">赤月纪事 › 章节写作</text>

  <rect x="326" y="150" width="602" height="128" rx="8" class="soft"/>
  <text x="356" y="188" class="ui h2">AI 命令面板</text>
  <rect x="356" y="210" width="526" height="42" rx="8" fill="#ffffff" stroke="#d9dde3"/>
  <text x="378" y="236" class="ui body">检查第 12 章伏笔是不是暴露太早</text>
  <text x="356" y="268" class="ui small">将创建：REV-012 审校工单 · 范围：第 12 章 + 青铜铃伏笔线</text>

  <rect x="326" y="318" width="602" height="146" rx="8" class="panel"/>
  <text x="356" y="356" class="ui h2">工单预览</text>
  <text x="356" y="392" class="ui body">目标：检查伏笔暴露、人物知情程度和信息释放节奏。</text>
  <text x="356" y="426" class="ui muted">预计产物：风险列表、修订建议、记忆候选。</text>
  <rect x="356" y="438" width="110" height="30" rx="8" class="active"/>
  <text x="384" y="458" class="ui small" fill="#ffffff">开始执行</text>
  <rect x="478" y="438" width="110" height="30" rx="8" fill="#ffffff" stroke="#d7dae0"/>
  <text x="506" y="458" class="ui small">修改范围</text>

  <rect x="326" y="512" width="602" height="238" rx="8" class="panel"/>
  <text x="356" y="550" class="ui h2">当前章节</text>
  <text x="356" y="586" class="ui body">雨从城楼兽吻滑下，落进林照掌心。</text>
  <text x="356" y="628" class="ui body">守门军士拦住他，灯笼扫过他的脸。</text>
  <text x="356" y="670" class="ui body">沈微澜在檐下抬头，像是早已等在那里。</text>

  <rect x="984" y="62" width="456" height="898" fill="#f7f7f8"/>
  <line x1="984" y1="62" x2="984" y2="960" class="line"/>
  <text x="1024" y="112" class="ui h2">AI 任务抽屉</text>
  <rect x="1320" y="86" width="42" height="34" rx="14" fill="#eef0f2"/>
  <text x="1334" y="108" class="ui h3">收</text>

  <rect x="1024" y="146" width="376" height="104" rx="8" class="panel"/>
  <text x="1052" y="180" class="ui h3">REV-012 伏笔暴露审校</text>
  <text x="1052" y="212" class="ui body">状态：运行中 · 上下文 68% · 引用 4 个对象</text>
  <rect x="1052" y="226" width="210" height="8" rx="4" fill="#dfe3e8"/>
  <rect x="1052" y="226" width="142" height="8" rx="4" fill="#111111"/>

  <rect x="1024" y="274" width="376" height="168" rx="8" class="panel"/>
  <text x="1052" y="308" class="ui h3">运行步骤</text>
  <circle cx="1060" cy="342" r="7" class="green"/>
  <text x="1082" y="346" class="ui body">读取正史记忆</text>
  <circle cx="1060" cy="376" r="7" class="green"/>
  <text x="1082" y="380" class="ui body">装配章节上下文</text>
  <circle cx="1060" cy="410" r="7" fill="#111111"/>
  <text x="1082" y="414" class="ui body">检查伏笔暴露风险</text>

  <rect x="1024" y="466" width="376" height="160" rx="8" class="panel"/>
  <text x="1052" y="500" class="ui h3">上下文包</text>
  <text x="1052" y="534" class="ui body">第 8 章：不知代价</text>
  <text x="1052" y="566" class="ui body">第 11 章：青铜铃首次显性出现</text>
  <text x="1052" y="598" class="ui body">人物：林照、沈微澜</text>

  <rect x="1024" y="650" width="376" height="142" rx="8" class="panel"/>
  <text x="1052" y="684" class="ui h3">初步风险</text>
  <text x="1052" y="720" class="ui red">沈微澜知情程度与第 8 章冲突</text>
  <text x="1052" y="752" class="ui amber">青铜铃意象强化不足</text>

  <rect x="1024" y="816" width="376" height="80" rx="8" class="panel"/>
  <text x="1052" y="850" class="ui h3">完成后动作</text>
  <text x="1052" y="880" class="ui body">生成修订建议，并加入 4 条记忆候选。</text>
</svg>

<svg width="1440" height="960" viewBox="0 0 1440 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Story Pilot 章节写作</title>
  <desc id="desc">章节写作工作台，左侧是作品区，中间为章节树、场景卡和正文编辑器，右侧为折叠看板。</desc>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .h1 { font-size: 20px; font-weight: 700; fill: #151515; }
    .h2 { font-size: 17px; font-weight: 700; fill: #25272b; }
    .h3 { font-size: 14px; font-weight: 700; fill: #25272b; }
    .body { font-size: 14px; fill: #4a5260; }
    .muted { font-size: 13px; fill: #858b95; }
    .small { font-size: 12px; fill: #858b95; }
    .side { fill: #f5f5f6; }
    .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
    .soft { fill: #f7f8fa; stroke: #e6e8ec; stroke-width: 1; }
    .tab { fill: #eef0f2; }
    .active { fill: #111111; }
    .line { stroke: #e5e7eb; stroke-width: 1; }
    .blue { fill: #0a66ff; }
    .red { fill: #c8342d; }
    .amber { fill: #a16700; }
  </style>

  <rect width="1440" height="960" rx="18" fill="#ffffff" stroke="#d8dbe0"/>
  <circle cx="28" cy="28" r="8" fill="#ff5f57"/>
  <circle cx="54" cy="28" r="8" fill="#ffbd2e"/>
  <circle cx="80" cy="28" r="8" fill="#28c840"/>

  <rect x="0" y="62" width="280" height="898" class="side"/>
  <line x1="280" y1="62" x2="280" y2="960" class="line"/>
  <text x="36" y="110" class="ui" font-size="23" font-weight="800" fill="#111111">story pilot</text>
  <text x="36" y="136" class="ui small">本地创作工作区</text>
  <text x="36" y="184" class="ui body">记忆库</text>
  <text x="36" y="230" class="ui body">预设库</text>
  <text x="36" y="276" class="ui body">设置</text>
  <text x="36" y="354" class="ui h3">作品</text>
  <rect x="28" y="382" width="224" height="48" rx="8" fill="#ffffff"/>
  <text x="52" y="412" class="ui h3">赤月纪事</text>
  <circle cx="236" cy="406" r="9" class="blue"/>
  <text x="232" y="410" class="ui" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="52" y="462" class="ui body">雾港来信</text>
  <text x="52" y="506" class="ui body">第七封遗书</text>

  <line x1="36" y1="594" x2="252" y2="594" class="line"/>
  <text x="36" y="636" class="ui h3">最近章节</text>
  <text x="52" y="674" class="ui body">第 12 章 雨夜入城</text>
  <text x="52" y="718" class="ui body">第 11 章 青铜铃</text>

  <rect x="280" y="62" width="1088" height="898" fill="#ffffff"/>
  <line x1="280" y1="114" x2="1368" y2="114" class="line"/>
  <text x="326" y="96" class="ui h1">赤月纪事 › 章节写作 › 第 12 章</text>
  <rect x="1208" y="78" width="98" height="28" rx="14" fill="#111111"/>
  <text x="1230" y="97" class="ui small" fill="#ffffff">生成草稿</text>

  <rect x="326" y="138" width="710" height="40" rx="8" class="tab"/>
  <text x="356" y="163" class="ui small">总览</text>
  <text x="424" y="163" class="ui small">预设</text>
  <rect x="484" y="144" width="72" height="28" rx="8" class="active"/>
  <text x="508" y="163" class="ui small" fill="#ffffff">章节</text>
  <text x="584" y="163" class="ui small">故事圣经</text>
  <text x="674" y="163" class="ui small">大纲</text>
  <text x="734" y="163" class="ui small">伏笔</text>
  <text x="794" y="163" class="ui small">记忆</text>
  <text x="854" y="163" class="ui small">元素</text>

  <rect x="326" y="206" width="234" height="614" rx="8" class="soft"/>
  <text x="354" y="240" class="ui h3">章节树</text>
  <rect x="354" y="266" width="178" height="42" rx="8" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="374" y="292" class="ui body">第 10 章 暗潮</text>
  <rect x="354" y="318" width="178" height="42" rx="8" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="374" y="344" class="ui body">第 11 章 青铜铃</text>
  <rect x="354" y="370" width="178" height="48" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="374" y="398" class="ui h3">第 12 章 雨夜入城</text>
  <text x="354" y="468" class="ui h3">场景卡</text>
  <rect x="354" y="492" width="178" height="44" rx="8" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="374" y="520" class="ui body">1. 城门盘查</text>
  <rect x="354" y="546" width="178" height="58" rx="8" fill="#ffffff" stroke="#111111"/>
  <text x="374" y="574" class="ui h3">2. 铃声回响</text>
  <text x="374" y="596" class="ui small">强化伏笔，不揭真相</text>
  <rect x="354" y="614" width="178" height="44" rx="8" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="374" y="642" class="ui body">3. 沈微澜隐瞒</text>

  <rect x="592" y="206" width="612" height="614" rx="8" class="panel"/>
  <text x="628" y="246" class="ui h2">正文编辑器</text>
  <text x="628" y="282" class="ui muted">目标：强化青铜铃伏笔，保持沈微澜知情程度模糊。</text>
  <line x1="628" y1="314" x2="1168" y2="314" class="line"/>
  <text x="628" y="358" class="ui body">雨从城楼兽吻滑下，落进林照掌心。</text>
  <text x="628" y="400" class="ui body">守门军士拦住他，灯笼扫过他的脸。</text>
  <text x="628" y="442" class="ui body">也照见他腰间裂开的木牌。林照听见了铃声。</text>
  <rect x="628" y="482" width="374" height="44" rx="8" fill="#f8f9fb" stroke="#dde1e7"/>
  <text x="650" y="510" class="ui body">沈微澜在檐下抬头，像是早已等在那里。</text>
  <rect x="650" y="538" width="104" height="30" rx="8" fill="#111111"/>
  <text x="678" y="558" class="ui small" fill="#ffffff">改写</text>
  <rect x="766" y="538" width="104" height="30" rx="8" fill="#ffffff" stroke="#d7dae0"/>
  <text x="794" y="558" class="ui small">扩写</text>
  <rect x="882" y="538" width="104" height="30" rx="8" fill="#ffffff" stroke="#d7dae0"/>
  <text x="904" y="558" class="ui small">审校</text>

  <rect x="1224" y="206" width="110" height="614" rx="8" class="soft"/>
  <text x="1246" y="240" class="ui h3">本章状态</text>
  <text x="1246" y="282" class="ui body">草稿</text>
  <text x="1246" y="314" class="ui muted">1,186 字</text>
  <text x="1246" y="362" class="ui body">场景</text>
  <text x="1246" y="394" class="ui muted">2 / 4</text>
  <text x="1246" y="442" class="ui body">风险</text>
  <text x="1246" y="474" class="ui amber">2 项</text>
  <text x="1246" y="522" class="ui body">记忆</text>
  <text x="1246" y="554" class="ui muted">4 候选</text>

  <rect x="1368" y="62" width="72" height="898" fill="#f7f7f8"/>
  <line x1="1368" y1="62" x2="1368" y2="960" class="line"/>
  <circle cx="1402" cy="124" r="18" fill="#ffffff" stroke="#e1e4e8"/>
  <text x="1395" y="129" class="ui small">进</text>
  <circle cx="1402" cy="180" r="18" fill="#ffffff" stroke="#e1e4e8"/>
  <text x="1395" y="185" class="ui small">任</text>
  <circle cx="1414" cy="166" r="6" class="red"/>
  <circle cx="1402" cy="236" r="18" fill="#ffffff" stroke="#e1e4e8"/>
  <text x="1395" y="241" class="ui small">险</text>
  <circle cx="1402" cy="292" r="18" fill="#ffffff" stroke="#e1e4e8"/>
  <text x="1395" y="297" class="ui small">记</text>
  <circle cx="1414" cy="278" r="6" class="blue"/>
</svg>

  <rect x="326" y="550" width="318" height="196" rx="8" class="panel"/>
  <text x="354" y="588" class="ui h2">下一步建议</text>
  <text x="354" y="624" class="ui body">先修正沈微澜知情程度，再生成第 12 章完整稿。</text>
  <text x="354" y="660" class="ui muted">依据：REV-012 审校风险，MEM-044 待确认。</text>
  <rect x="354" y="696" width="126" height="32" rx="8" class="active"/>
  <text x="388" y="717" class="ui small" fill="#ffffff">处理阻断</text>

  <rect x="668" y="550" width="318" height="196" rx="8" class="panel"/>
  <text x="696" y="588" class="ui h2">命令面板</text>
  <text x="696" y="624" class="ui body">输入自然语言，系统会转成工单预览。</text>
  <rect x="696" y="656" width="248" height="38" rx="8" fill="#f8f9fb" stroke="#dde1e7"/>
  <text x="718" y="680" class="ui muted">检查第 12 章伏笔暴露风险</text>
  <text x="696" y="724" class="ui small">快捷键：Cmd K</text>

  <rect x="1104" y="62" width="336" height="898" fill="#f7f7f8"/>
  <line x1="1104" y1="62" x2="1104" y2="960" class="line"/>

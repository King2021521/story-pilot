  <text x="36" y="636" class="ui h3">最近章节</text>
  <text x="52" y="674" class="ui body">第 12 章 雨夜入城</text>
  <text x="52" y="718" class="ui body">第 11 章 青铜铃</text>

  <circle cx="48" cy="902" r="18" fill="#eef0f2"/>
  <text x="39" y="907" class="ui h3">XI</text>
  <text x="78" y="900" class="ui h3">xiaomin.zhang</text>
  <text x="78" y="920" class="ui small">creator workspace</text>

  <rect x="280" y="62" width="824" height="898" fill="#ffffff"/>
  <line x1="280" y1="114" x2="1104" y2="114" class="line"/>
  <text x="326" y="96" class="ui h1">赤月纪事 › 工作台总览</text>
  <rect x="980" y="78" width="84" height="28" rx="14" fill="#f2f3f5"/>
  <text x="1004" y="97" class="ui small">Cmd K</text>

  <rect x="326" y="138" width="704" height="40" rx="8" class="tab"/>
  <rect x="332" y="144" width="72" height="28" rx="8" class="active"/>

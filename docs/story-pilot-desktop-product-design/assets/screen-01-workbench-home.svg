  <rect x="1130" y="510" width="252" height="130" rx="8" class="panel"/>
  <text x="1154" y="544" class="ui h3">最近产物</text>
  <text x="1154" y="580" class="ui body">伏笔强化方案</text>
  <text x="1154" y="612" class="ui body">第 12 章修订建议</text>

  <rect x="1130" y="664" width="252" height="130" rx="8" class="panel"/>
  <text x="1154" y="698" class="ui h3">记忆候选</text>
  <text x="1154" y="734" class="ui body">新增 2 · 变更 1 · 冲突 1</text>
  <text x="1154" y="766" class="ui muted">确认后影响后续章节生成。</text>

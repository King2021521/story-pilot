  <text x="354" y="432" class="ui h3">故事圣经</text>
  <text x="354" y="466" class="ui body">人物 9 · 世界规则 28</text>
  <text x="354" y="494" class="ui muted">2 条设定待确认</text>

  <rect x="554" y="398" width="204" height="116" rx="8" class="panel"/>
  <text x="582" y="432" class="ui h3">章节写作</text>

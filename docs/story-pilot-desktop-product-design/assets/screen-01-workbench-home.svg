  <rect x="1136" y="151" width="62" height="26" rx="8" class="active"/>
  <text x="1156" y="169" class="ui small" fill="#ffffff">任务</text>
  <text x="1224" y="169" class="ui small">风险</text>
  <text x="1284" y="169" class="ui small">产物</text>
  <text x="1338" y="169" class="ui small">记忆</text>

  <rect x="1130" y="206" width="252" height="122" rx="8" class="panel"/>
  <text x="1154" y="240" class="ui h3">工单队列</text>
  <circle cx="1162" cy="276" r="7" fill="#111111"/>
  <text x="1182" y="280" class="ui body">CH-012 待生成修订稿</text>
  <circle cx="1162" cy="306" r="7" fill="#9aa1aa"/>
  <text x="1182" y="310" class="ui body">MEM-044 待确认</text>

  <rect x="1130" y="352" width="252" height="134" rx="8" class="panel"/>

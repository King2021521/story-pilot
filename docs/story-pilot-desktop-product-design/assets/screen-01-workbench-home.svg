  <text x="354" y="244" class="ui h2">今日创作闭环</text>
  <text x="354" y="276" class="ui body">CH-012：强化青铜铃伏笔，生成第 12 章修订稿，并确认 4 条记忆候选。</text>
  <rect x="354" y="294" width="112" height="30" rx="8" class="active"/>
  <text x="382" y="314" class="ui small" fill="#ffffff">继续工单</text>
  <rect x="478" y="294" width="126" height="30" rx="8" fill="#ffffff" stroke="#d7dae0"/>
  <text x="510" y="314" class="ui small">运行审校</text>

  <text x="326" y="374" class="ui h2">创作资产</text>
